[project]
name = "chronopix"
version = "0.1.0"
description = "Pixel based visual environments for temporal AI"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [
  {name = "Arvin Van der Walt", email = "72958832+PerfectPickle@users.noreply.github.com"},
]
keywords = [
    "predictive-coding",
    "neural-networks",
    "temporal-predictive-coding",
    "inference-learning",
]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
    "numpy>=2.0.0",
    "imageio[ffmpeg]>=2.37.4",
    "pygame>=2.6.1"
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build]
include = ["chronopix*"]

